name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**.kt'
      - '**.kts'
      - 'app/src/**'
      - '.github/workflows/android.yml'
      - 'app/build.gradle.kts'
      - 'gradle.properties'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Configure production signing key
        if: ${{ secrets.ZIPMM_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ZIPMM_KEYSTORE_BASE64 }}" | base64 --decode > "${{ runner.temp }}/zipmm-release.jks"
          echo "ZIPMM_KEYSTORE_PATH=${{ runner.temp }}/zipmm-release.jks" >> "$GITHUB_ENV"
          echo "ZIPMM_KEYSTORE_PASSWORD=${{ secrets.ZIPMM_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ZIPMM_KEY_ALIAS=${{ secrets.ZIPMM_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ZIPMM_KEY_PASSWORD=${{ secrets.ZIPMM_KEY_PASSWORD }}" >> "$GITHUB_ENV"
      - name: Build APKs
        run: gradle assembleDebug assembleRelease
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZIPMM-MOVIE-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ZIPMM-MOVIE-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
