name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - '**.kt'
      - '**.kts'
      - 'app/src/**'
      - '.github/workflows/android.yml'
      - 'app/build.gradle.kts'
      - 'gradle.properties'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: ZIPMM-MOVIE-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Check release signing secrets
        id: signing
        env:
          KEYSTORE: ${{ secrets.ZIPMM_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ZIPMM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZIPMM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZIPMM_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Production APK skipped. Configure the four ZIPMM release-signing repository secrets."
          fi
      - name: Configure release keystore
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE: ${{ secrets.ZIPMM_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ZIPMM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZIPMM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZIPMM_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/zipmm-release.jks"
          echo "ZIPMM_KEYSTORE_PATH=$RUNNER_TEMP/zipmm-release.jks" >> "$GITHUB_ENV"
          echo "ZIPMM_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ZIPMM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ZIPMM_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed production release APK
        if: steps.signing.outputs.ready == 'true'
        run: gradle assembleRelease
      - name: Upload signed release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ZIPMM-MOVIE-production-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
